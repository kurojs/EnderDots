# Kuromy - Pure Black, Cool Gray & Pastel Lavender (Borderless Edition)
# Pure black background, cool gray text, soft pastel lavender-pink primary, muted purple accents

[meta]
version = 1
name = "kuromy-purple"
description = "Clean borderless theme with pure black background, cool gray text, soft pastel lavender primary, and muted purple accents"
variant = "dark"

[colors.core]
background = "#000000"           # Pure pitch black background
foreground = "#d4d8dc"           # Cool neutral light gray (crisp & soft)
secondary_background = "#141019" # Subtle deep dark layer with a hint of violet (no borders)
border = "transparent"           # Borders completely removed
accent = "#b8a1e3"               # Primary accent: soft pastel lavender with a pink lean

[colors.accents]
green = "#1db954"                # Semantic green kept for success/online states
magenta = "#c6b0d8"              # Desaturated pastel pink-lavender
orange = "#e09060"               # Muted warm orange
purple = "#a893cf"               # Muted lavender purple
red = "#e05252"                  # Soft clean red
yellow = "#e0cb73"               # Muted warm yellow
cyan = "#b8a1e3"                 # Mapped to the primary pastel lavender

[colors.list.item.selection]
background = "#1c1726"           # Deep muted violet selection background
secondary_background = "#2a2338" # Highlighted item background
