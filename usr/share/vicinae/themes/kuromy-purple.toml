# Kuromy - Pure Black, Cool Gray & Soft Mauve (Borderless Edition)
# Pure black background, cool gray text, very soft desaturated mauve primary, muted purple accents

[meta]
version = 1
name = "kuromy-purple"
description = "Clean borderless theme with pure black background, cool gray text, very soft desaturated mauve primary, and muted purple accents"
variant = "dark"

[colors.core]
background = "#000000"           # Pure pitch black background
foreground = "#d4d8dc"           # Cool neutral light gray (crisp & soft)
secondary_background = "#131118" # Subtle deep dark layer with a faint violet hint (no borders)
border = "transparent"           # Borders completely removed
accent = "#c7bcd9"               # Primary accent: very soft grayish mauve

[colors.accents]
green = "#1db954"                # Semantic green kept for success/online states
magenta = "#cdc3da"              # Barely-tinted pastel mauve
orange = "#e09060"               # Muted warm orange
purple = "#b3a9c7"               # Muted grayish lavender
red = "#e05252"                  # Soft clean red
yellow = "#e0cb73"               # Muted warm yellow
cyan = "#c7bcd9"                 # Mapped to the primary soft mauve

[colors.list.item.selection]
background = "#1e1b26"           # Very muted violet-gray selection background
secondary_background = "#2b2735" # Highlighted item background
