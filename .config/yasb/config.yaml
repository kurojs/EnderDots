watch_stylesheet: true
watch_config: true
debug: false

bars:
  status-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    animation:
      enabled: true
      duration: 400
    alignment:
      position: "top"
      align: "center"
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 40
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        [
          "github"
        ]
      center:
        [
          "windows_workspaces",
          "cava"
        ]
      right:
        [
          "cpu",
          "gpu",
          "memory",
          "power_menu"
        ]

widgets:
  github:
      type: "yasb.github.GithubWidget"
      options:
        label: "<span>\ue708</span>"
        label_alt: "GitHub {data}"
        tooltip: true
        update_interval: 300
        token: ""
        max_notification: 20
        only_unread: true
        max_field_size: 54
        menu:
          blur: true
          round_corners: true
          round_corners_type: "normal"
          border_color: "System"
          alignment: "left"
          direction: "down"
          offset_top: 6
          offset_left: 0
          show_categories: true

  windows_workspaces:
      type: "yasb.windows_desktops.WorkspaceWidget"
      options:
        label_workspace_btn: "\u25cf"
        label_workspace_active_btn: "\u25cf"

  cava:
      type: "yasb.cava.CavaWidget"
      options:
        bar_height: 22
        min_bar_height: 2
        bars_number: 20
        bar_width: 3
        bar_spacing: 2
        bar_type: "bars_mirrored"
        foreground: "#9d5cff"
        gradient: 1
        gradient_color_1: "#3a0068"
        gradient_color_2: "#9d5cff"
        gradient_color_3: "#c99bff"
        framerate: 60
        sensitivity: 100
        noise_reduction: 77
        monstercat: 1
        hide_empty: false
        sleep_timer: 5
        edge_fade: [8, 8]
        callbacks:
          on_left: "do_nothing"
          on_right: "reload_cava"

  cpu:
      type: "yasb.cpu.CpuWidget"
      options:
        label: "<span>\ueea1</span> {info[percent][total]}%"
        label_alt: "<span>\ueea1</span> {info[histograms][cpu_percent]}"
        update_interval: 1000
        histogram_icons:
          - "\u2581"
          - "\u2581"
          - "\u2582"
          - "\u2583"
          - "\u2584"
          - "\u2585"
          - "\u2586"
          - "\u2587"
          - "\u2588"
        histogram_num_columns: 8
        callbacks:
          on_left: "do_nothing"
          on_middle: "exec cmd /c Taskmgr"
          on_right: "toggle_label"

  gpu:
      type: "yasb.gpu.GpuWidget"
      options:
        label: "<span>\uf4bc</span> {info[temp]}°C"
        label_alt: "<span>\uf4bc</span> {info[temp]}°C | {info[mem_used]} / {info[mem_total]}"
        update_interval: 2000
        gpu_thresholds:
          low: 25
          medium: 50
          high: 90
        histogram_icons:
          - "\u2581"
          - "\u2581"
          - "\u2582"
          - "\u2583"
          - "\u2584"
          - "\u2585"
          - "\u2586"
          - "\u2587"
          - "\u2588"
        histogram_num_columns: 8
        callbacks:
          on_left: "do_nothing"
          on_middle: "exec cmd /c Taskmgr"
          on_right: "toggle_label"

  memory:
      type: "yasb.memory.MemoryWidget"
      options:
        label: "<span>\uefc5</span> {virtual_mem_used} / {virtual_mem_total}"
        label_alt: "<span>\uf4bc</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
        update_interval: 5000
        callbacks:
          on_left: "do_nothing"
          on_middle: "exec cmd /c Taskmgr"
          on_right: "toggle_label"
        memory_thresholds:
          low: 25
          medium: 50
          high: 90
  power_menu:
      type: "yasb.power_menu.PowerMenuWidget"
      options:
        label: "\ue7e8"
        uptime: true
        blur: false
        blur_background: true
        animation_duration: 300
        button_row: 3
        buttons:
          lock: ["\uea75", "Lock"]
          signout: ["\udb80\udf43", "Sign out"]
          shutdown: ["\uf011", "Shut Down"]
          restart: ["\uead2", "Restart"]
          hibernate: ["\uf28e", "Hibernate"]
          cancel: ["\udb81\udf3a", "Cancel"]
