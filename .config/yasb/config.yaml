watch_stylesheet: true
watch_config: true
debug: false
bars:
  status-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    animation:
      enabled: true
      duration: 400
    alignment:
      position: "top"
      align: "center"
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 40
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        [
          "opencode_status",
          "cava"
        ]
      center:
        [
          "workspaces"
        ]
      right:
        [
          "volume",
          "cpu",
          "gpu",
          "memory",
          "copilot"
        ]
widgets:
  active_window:
      type: "yasb.active_window.ActiveWindowWidget"
      options:
        label: "{win[app_name]}"
        label_icon: true
        label_icon_size: 22
        max_length: 40
        callbacks:
          on_left: "do_nothing"
          on_middle: "do_nothing"
          on_right: "do_nothing"

  opencode_status:
      type: "yasb.opencode.OpenCodeWidget"
      options:
        class_name: "opencode-widget"
        state_file: "C:\\Users\\kuuro\\.config\\yasb\\opencode_state.json"
        pi_state_file: "C:\\Users\\kuuro\\.config\\yasb\\pi_state.json"
        poll_interval: 250
        anim_interval: 33
        columns: 16
        bar_width: 3
        bar_spacing: 2
        bar_height: 16
        sigma: 1.5
        trail: 2.0
        envelope: 6.5
        step: 0.5
        min_alpha: 0.15
        font_family: "なぎの"
        font_size: 20
        callbacks:
          on_left: "do_nothing"
          on_middle: "do_nothing"
          on_right: "do_nothing"

  copilot:
      type: "yasb.copilot.CopilotWidget"
      options:
        label: '<span><img src="file:///C:/Users/kuuro/.config/yasb/icons/power.png" height="22"/></span>'
        label_alt: '<span><img src="file:///C:/Users/kuuro/.config/yasb/icons/power.png" height="22"/></span>'
        token: ""
        plan: "pro"
        tooltip: false
        update_interval: 120
  cava:
      type: "yasb.cava.CavaWidget"
      options:
        bar_height: 22
        min_bar_height: 2
        bars_number: 20
        bar_width: 3
        bar_spacing: 2
        bar_type: "bars_mirrored"
        foreground: "#8080C0"
        gradient: 0
        framerate: 60
        sensitivity: 100
        noise_reduction: 77
        monstercat: 1
        hide_empty: false
        sleep_timer: 5
        edge_fade: [8, 8]
        callbacks:
          on_left: "do_nothing"
          on_right: "reload_cava"
  cpu:
      type: "yasb.cpu.CpuWidget"
      options:
        label: "{info[percent][total]}%"
        label_alt: "{info[histograms][cpu_percent]}"
        update_interval: 1000
        histogram_icons:
          - "\u2581"
          - "\u2581"
          - "\u2582"
          - "\u2583"
          - "\u2584"
          - "\u2585"
          - "\u2586"
          - "\u2587"
          - "\u2588"
        histogram_num_columns: 8
        callbacks:
          on_left: "do_nothing"
          on_middle: "exec cmd /c Taskmgr"
          on_right: "toggle_label"
  gpu:
      type: "yasb.gpu.GpuWidget"
      options:
        label: "{info[temp]}°C"
        label_alt: "{info[temp]}°C | {info[mem_used]} / {info[mem_total]}"
        update_interval: 2000
        gpu_thresholds:
          low: 25
          medium: 50
          high: 90
        histogram_icons:
          - "\u2581"
          - "\u2581"
          - "\u2582"
          - "\u2583"
          - "\u2584"
          - "\u2585"
          - "\u2586"
          - "\u2587"
          - "\u2588"
        histogram_num_columns: 8
        callbacks:
          on_left: "do_nothing"
          on_middle: "exec cmd /c Taskmgr"
          on_right: "toggle_label"
  memory:
      type: "yasb.memory.MemoryWidget"
      options:
        label: "{virtual_mem_used} / {virtual_mem_total}"
        label_alt: "VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
        update_interval: 5000
        callbacks:
          on_left: "do_nothing"
          on_middle: "exec cmd /c Taskmgr"
          on_right: "toggle_label"
        memory_thresholds:
          low: 25
          medium: 50
          high: 90
  volume:
      type: "yasb.spotify_volume.SpotifyVolumeWidget"
      options:
        class_name: "spotify"
        label: "Spotify"
        label_alt: "Spotify"
        tooltip: true
        scroll_step: 4
        process: "Spotify.exe"
        icons:
          muted: "\uf1f6"
          "10": "\uf1bc"
          "30": "\uf1bc"
          "60": "\uf1bc"
          "100": "\uf1bc"
        callbacks:
          on_left: "toggle_play_pause"
          on_right: "toggle_label"
  workspaces:
      type: "yasb.workspaces.WorkspacesWidget"
      options:
        label_workspace_btn: "{kanji}"
        label_workspace_active_btn: "{kanji}"
        callbacks:
          on_left: "activate_workspace"
          on_middle: "do_nothing"
          on_right: "do_nothing"


